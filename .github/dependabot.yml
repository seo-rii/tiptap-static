version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      tiptap:
        patterns:
          - "@tiptap/*"
      framework-fixtures:
        patterns:
          - "svelte"
          - "svelte-tiptap"
          - "react"
          - "react-dom"
          - "vue"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
